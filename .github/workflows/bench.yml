name: Benchmarks

# Manual only: shared runners are too noisy to gate merges on performance.
on: workflow_dispatch

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench -p parkring-bench --bench throughput
      - run: cargo bench -p parkring-bench --bench latency
      - run: cargo run -p parkring-bench --release --example plot > bench-tables.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            target/criterion
            target/latency
            assets/*.svg
            bench-tables.md
