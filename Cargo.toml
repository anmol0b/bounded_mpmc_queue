[package]
name = "bounded_mpmc_queue"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Bounded multi-producer multi-consumer queues in std-only Rust: a Vyukov-style lock-free ring with spin-then-park waiting, and a Mutex+Condvar reference implementation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/anmol0b/bounded_mpmc_queue"
readme = "README.md"
keywords = ["mpmc", "queue", "lock-free", "concurrency", "ring-buffer"]
categories = ["concurrency", "data-structures"]
exclude = ["assets/", "docs/", ".github/"]

[dependencies]
# Intentionally empty: the library is std-only.

# Only compiled under `RUSTFLAGS="--cfg loom"`; never part of a downstream build.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[profile.bench]
lto = "fat"
codegen-units = 1
debug = 1

[profile.release]
debug = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
cast_possible_wrap = "allow"
